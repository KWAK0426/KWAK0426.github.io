<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>드래곤볼 피규어 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee;--panel:#fffdf9;--ink:#1d1a16;--mute:#7a7268;--line:#e4ddd2;
  --acc:#e8661c;--acc2:#ffb347;--ok:#2f8a4b;--off:#b9b2a7;--chip:#efe8dd;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16140f;--panel:#1f1c16;--ink:#f1ece4;--mute:#a39b8f;--line:#332e26;--chip:#2a261f;--off:#5c564d}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans KR",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 18px 10px}
h1{margin:0 0 2px;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h1 .ball{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd27a,var(--acc) 70%);display:inline-grid;place-items:center;color:#c0392b;font-size:10px}
.sub{color:var(--mute);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=search],input[type=text],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1;min-width:200px}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:500}
.chip.dis{text-decoration:line-through;opacity:.5}
.chip .x{margin-left:5px;opacity:.6}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px}
.seg button.on{background:var(--ink);color:var(--bg)}
.stats{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--mute);margin-top:8px}
.prog{flex:1;max-width:260px;height:6px;background:var(--chip);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
main{padding:14px 18px 60px}
.year{margin:20px 0 8px;display:flex;align-items:baseline;gap:10px}
.year h2{margin:0;font-size:18px}
.year span{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card.own{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.card.off{opacity:.42;filter:grayscale(1)}
.chk{position:absolute;top:7px;right:7px;background:#c0392b;color:#fff;font-size:10.5px;padding:1px 6px;border-radius:999px}
.img.pt{outline:2px dashed var(--acc);outline-offset:-4px}
.img{aspect-ratio:1/1;background:var(--chip);display:grid;place-items:center;color:var(--mute);font-size:12px;cursor:pointer;position:relative}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.img .hint{text-align:center;padding:8px}
.badge{position:absolute;top:7px;left:7px;background:var(--ok);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.badge.no{background:rgba(0,0,0,.45)}
.body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:700;font-size:13.5px;line-height:1.3}
.ser{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 0 6px;padding:6px 10px;border-left:3px solid var(--acc);background:var(--panel);border-radius:0 8px 8px 0}
.ser b{font-size:14px}.ser span{color:var(--mute);font-size:12px}.ser a{font-size:12px;color:var(--acc);margin-left:auto}
.cn{font-weight:700;font-size:15px;line-height:1.3;text-align:center}
.pn{color:var(--mute);font-size:11px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center}
.lk{font-size:11.5px;color:var(--acc);text-decoration:none;text-align:center}
.lk:hover{text-decoration:underline}
.card .meta{text-align:center}
.meta{color:var(--mute);font-size:11.5px}
.kw{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.kw span{font-size:10.5px;background:var(--chip);padding:0 6px;border-radius:5px;color:var(--mute)}
.acts{display:flex;gap:5px;margin-top:auto;padding-top:6px}
.acts button{padding:4px 2px;font-size:11.5px;flex:1;white-space:nowrap}
.st3{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.st3 button{flex:1;border:0;border-radius:0;padding:5px 0;font-size:12px;background:var(--panel);white-space:nowrap}
.st3 button+button{border-left:1px solid var(--line)}
.st3 button.on.s-own{background:var(--ok);color:#fff}
.st3 button.on.s-plan{background:var(--acc2);color:#3a2400}
.st3 button.on.s-none{background:var(--ink);color:var(--bg)}
.st3 button.on.s-noplan{background:var(--off);color:#fff}
.st3.sub{margin-top:4px}
.st3.sub button{font-size:11px;padding:4px 0}
.card.noplan{border-style:dashed;opacity:.4;filter:grayscale(1)}
.card.noplan:hover{opacity:.85}
.badge.noplan{background:var(--off);color:#fff}
.card.plan{border-color:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc2)}
.badge.plan{background:var(--acc2);color:#3a2400}
.empty{color:var(--mute);text-align:center;padding:60px 10px}
.note{background:#fff3cd;color:#6b5100;border-radius:8px;padding:6px 10px;font-size:12px;margin-top:8px;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.dlg{background:var(--panel);border-radius:14px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 12px}
.form{display:grid;grid-template-columns:90px 1fr;gap:8px 10px;align-items:center}
.form label{color:var(--mute);font-size:12.5px}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
textarea{width:100%;min-height:150px;font-family:ui-monospace,monospace;font-size:12px}
.lines-ed .ln{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lines-ed .ln b{flex:1;font-weight:500}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
small.help{color:var(--mute);display:block;margin-top:6px;font-size:11.5px}

/* ===== clean theme (overrides) ===== */

@media (prefers-color-scheme:dark){:root{--bg:#141311;--panel:#1d1b18;--ink:#efebe4;--mute:#9a9389;--line:#2e2b26;--chip:#26231f;--off:#5a554d}}

.lhead{display:flex;align-items:center;gap:10px;margin:28px 0 4px;padding:12px 14px;background:var(--panel,#fff);border:1px solid var(--line,#e5e5e5);border-left:5px solid var(--acc,#03c75a);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.lhead h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.lhead span{color:var(--mute);font-size:12px;background:var(--chip);padding:2px 8px;border-radius:999px}
.lsec .year{margin:22px 0 6px}
.lsec .year h2{font-size:17px;font-weight:700;color:var(--mute)}
.cvtag{position:absolute;top:8px;right:8px;z-index:2;background:linear-gradient(90deg,#7b5cff,#d54bff);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.card .img{position:relative}
.card{content-visibility:auto;contain-intrinsic-size:auto 360px}
.lsec{contain:layout style}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><span class="ball">★</span>드래곤볼 피규어</h1>
    <div class="stats"><span id="statTxt">불러오는 중…</span><div class="prog"><i id="progBar" style="width:0"></i></div></div>
    <div class="menu">
      <button class="pri" id="addBtn" style="display:none"></button>
      <button id="menuBtn" aria-label="메뉴">⋯</button>
      <div class="drop" id="drop">
        <button id="bulkBtn" style="display:none"></button>
        <button id="linesBtn" style="display:none"></button>
        <button id="folderBtn" style="display:none"></button>
        <button id="ioBtn">백업 / 복원</button>
      </div>
      <input type="file" id="folderIn" webkitdirectory directory multiple accept="image/*" style="display:none">
    </div>
  </div>
  <div class="bar">
    <div class="sbox"><input type="search" id="q" placeholder="찾고 싶은 피규어를 검색해 보세요 (캐릭터, 회차, 일본어 원제)"><span class="sicon">⌕</span><button id="saveKw" title="검색어 저장">☆</button></div>
    <div class="seg" id="status">
      <button data-v="all" class="on">전체</button><button data-v="own">있음</button><button data-v="need">없음</button><button data-v="plan">구매 예정</button><button data-v="noplan">예정 없음</button>
    </div>
    <select id="sort"><option value="desc">최신순</option><option value="asc">오래된순</option></select>
    <label class="tog"><input type="checkbox" id="showOff">비활성 보기</label>
  </div>
  <div class="chips" id="kwChips"></div>
  <div class="chips lines" id="lineChips"></div>
  <div class="note" id="note"></div>
</header>
<main id="main"></main>

<!-- edit modal -->
<div class="modal" id="mEdit"><div class="dlg">
  <h3 id="eTitle">피규어 추가</h3>
  <div class="form">
    <label>이름*</label><input type="text" id="fName" placeholder="예: 손오공 (초사이어인)">
    <label>캐릭터</label><input type="text" id="fChar" placeholder="예: 손오공">
    <label>라인*</label><select id="fLine"></select>
    <label>시리즈</label><input type="text" id="fSeries" placeholder="예: 제일복권 ○○편 A상">
    <label>출시 연도</label><input type="number" id="fYear" min="1980" max="2100" placeholder="예: 2024">
    <label>키워드</label><input type="text" id="fKw" placeholder="쉼표로 구분: 초사이어인, 셀편, A상">
    <label>메모</label><input type="text" id="fNote" placeholder="구매처, 가격, 상태 등">
    <label>이미지</label><div><input type="file" id="fImg" accept="image/*"><small class="help">카드 이미지 칸에 사진을 드래그하거나, 카드 클릭 후 붙여넣기(Ctrl+V)도 됩니다.</small></div>
    <label>상태</label><div style="display:flex;gap:14px"><select id="fStat"><option value="own">있음</option><option value="none">없음 (미정)</option><option value="plan">없음 · 구매 예정</option><option value="noplan">없음 · 구매 예정 없음</option></select><label><input type="checkbox" id="fOff"> 비활성(구매 안 함)</label></div>
  </div>
  <div class="row-end"><button id="eDel" style="margin-right:auto;color:#c0392b">삭제</button><button data-close>취소</button><button class="pri" id="eSave">저장</button></div>
</div></div>

<!-- bulk modal -->
<div class="modal" id="mBulk"><div class="dlg">
  <h3>일괄 추가</h3>
  <div class="sub">한 줄에 하나씩: <b>연도 | 라인 | 이름 | 캐릭터 | 시리즈 | 키워드</b> (뒤쪽은 생략 가능, 탭 구분도 가능)</div>
  <textarea id="bulkTxt" placeholder="2024 | 제일복권 | 손오공 A상 | 손오공 | 제일복권 ○○편 | 초사이어인, A상"></textarea>
  <div class="row-end"><button data-close>취소</button><button class="pri" id="bulkGo">추가</button></div>
</div></div>

<!-- lines modal -->
<div class="modal" id="mLines"><div class="dlg">
  <h3>라인 관리</h3>
  <div class="sub">라인을 비활성화하면 그 라인의 제품 전체가 회색 처리되고 진행률에서 빠집니다.</div>
  <div class="lines-ed" id="linesEd"></div>
  <div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="newLine" placeholder="새 라인 이름" style="flex:1"><button id="addLine">추가</button></div>
  <div class="row-end"><button data-close class="pri">닫기</button></div>
</div></div>

<!-- io modal -->
<div class="modal" id="mIO"><div class="dlg">
  <h3>백업 / 복원</h3>
  <div class="sub">‘복사’로 전체 목록 JSON을 클립보드에 복사합니다. 복원은 JSON을 붙여넣고 ‘가져오기’ (기존 항목에 추가).</div>
  <textarea id="ioTxt"></textarea>
  <div class="row-end"><button id="ioCopy">복사</button><button data-close>닫기</button><button class="pri" id="ioImport">가져오기</button></div>
</div></div>

<!-- confirm -->
<div class="modal" id="mConf"><div class="dlg" style="width:min(360px,100%)">
  <div id="confTxt"></div>
  <div class="row-end"><button data-close>취소</button><button class="pri" id="confOk">확인</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_LINES=["조형천하","제일복권","솔리드엣지워크","매치 메이커스","월드 콜렉터블(30주년)","기간틱","DXF","Grandista","Blood of Saiyans","Clearise","G×materia","Maximatic","History Box","S.H.Figuarts","Figuarts ZERO","Dimension of DRAGONBALL","Dragon Ball Arise"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st={items:new Map(),settings:{lines:DEFAULT_LINES.map(n=>({name:n,off:false})),q:"",saved:[],status:"all",lineSel:[],showOff:false,sort:"desc"},loaded:false,editId:null,canWrite:true};
let DB=null, ASSETS=null, LOCAL=false;

/* ---------- storage layer ---------- */
const LS="dbfig.public.v1";const PUBLIC=true;
/* catalog (reference list shipped with the page) + overrides (your checks/edits, stored) */
st.cat=new Map();st.over=new Map();
function rebuild(){
  const m=new Map();
  st.cat.forEach((c,id)=>m.set(id,{...c}));
  st.over.forEach((o,id)=>{const c=m.get(id)||{};const v={...c,...o,id};if(st.cat.has(id)&&!o.custom){["name","series","seriesKo","prize","date","year","line","url","kw","imgCheck","cv"].forEach(k=>{if(k in c)v[k]=c[k]})}if(c.char&&!o.charCustom&&!o.custom)v.char=c.char;m.set(id,v)});
  m.forEach((v,id)=>{if(v.deleted)m.delete(id)});
  st.items=m;
}
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");if(o.settings)Object.assign(st.settings,o.settings);(o.items||[]).forEach(it=>st.over.set(it.id,it));rebuild()}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({settings:st.settings,items:[...st.over.values()]}));}catch(e){toast("브라우저 저장공간이 부족합니다");}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

async function putItem(it){
  st.over.set(it.id,it);rebuild();render();
  if(LOCAL){lsSave();return}
  const {id,...body}=it;
  try{await DB.collection("figures").doc(id).set(body)}catch(e){handleErr(e)}
}
async function delItem(id){
  const inCat=st.cat.has(id);
  if(inCat)st.over.set(id,{id,deleted:true});else st.over.delete(id);
  rebuild();render();
  if(LOCAL){lsSave();return}
  try{inCat?await DB.collection("figures").doc(id).set({deleted:true}):await DB.collection("figures").doc(id).delete()}catch(e){handleErr(e)}
}
let setTimer=null,setBusy=false,setDirty=false;
function saveSettings(delay=0){
  if(LOCAL){lsSave();return}
  clearTimeout(setTimer);setTimer=setTimeout(flushSettings,delay);
}
async function flushSettings(){
  if(setBusy){setDirty=true;return}
  setBusy=true;
  try{await DB.doc("meta/settings").set(JSON.parse(JSON.stringify(st.settings)))}catch(e){handleErr(e)}
  setBusy=false;if(setDirty){setDirty=false;flushSettings()}
}
function handleErr(e){
  if(e&&e.code==="invalid_argument"&&!st.canWrite===false){}
  if(e&&e.code==="invalid_argument"){st.canWrite=false;note("이 보기에서는 수정 권한이 없어 읽기 전용입니다.")}
  else if(e&&e.code==="quota_exceeded"){note("저장 공간 한도에 도달했습니다: "+e.message)}
  else note("저장 오류: "+(e&&e.message||e));
}
function note(t){const n=$("#note");n.textContent=t;n.style.display=t?"block":"none"}
function toast(t){const n=$("#toast");n.textContent=t;n.classList.add("show");clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove("show"),1800)}

/* ---------- image handling ---------- */
function shrink(file,max){
  return new Promise((res,rej)=>{
    const img=new Image();img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej("변환 실패"),"image/jpeg",.85);URL.revokeObjectURL(img.src)};
    img.onerror=()=>rej("이미지를 읽을 수 없습니다");img.src=URL.createObjectURL(file);
  });
}
async function storeImage(file){
  if(!file||!file.type.startsWith("image/"))throw "이미지 파일이 아닙니다";
  if(!LOCAL&&ASSETS){
    const blob=await shrink(file,700);const r=await ASSETS.upload(blob);return {img:r.id};
  }
  const blob=await shrink(file,320);
  const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
  return {img:url};
}
st.autoImg={};
const imgSrc=it=>it.img?(it.img.startsWith("data:")?it.img:"/_blob/"+encodeURIComponent(it.img)):(it.simg?it.simg:(st.autoImg[it.id]?"/_blob/"+encodeURIComponent(st.autoImg[it.id]):""));
async function setImageFor(id,file){
  const it=st.items.get(id);if(!it)return;
  try{toast("이미지 업로드 중…");const r=await storeImage(file);await putItem({...it,...r});toast("이미지 저장됨")}
  catch(e){toast(typeof e==="string"?e:"업로드 실패: "+(e.message||e.code||e))}
}

/* ---------- filtering ---------- */
const lineOff=name=>!!(st.settings.lines.find(l=>l.name===name)||{}).off;
const isOff=it=>it.off||lineOff(it.line);
function matches(it,terms){
  if(!terms.length)return true;
  const hay=[it.name,it.char,it.line,it.series,it.seriesKo,it.prize,it.year,(it.kw||[]).join(" "),it.note].join(" ").toLowerCase();
  return terms.every(t=>hay.includes(t));
}
function visible(){
  const s=st.settings,terms=s.q.toLowerCase().split(/\s+/).filter(Boolean);
  return [...st.items.values()].filter(it=>{
    if(!s.showOff&&isOff(it))return false;
    if(s.lineSel.length&&!s.lineSel.includes(it.line))return false;
    if(s.status==="own"&&!it.owned)return false;
    if(s.status==="need"&&it.owned)return false;
    if(s.status==="plan"&&(it.owned||!it.plan))return false;
    if(s.status==="noplan"&&(it.owned||!it.noplan))return false;
    return matches(it,terms);
  });
}

/* ---------- render ---------- */
let _raf=0;function render(){if(!_raf)_raf=requestAnimationFrame(()=>{_raf=0;renderNow()})}
const MAIN={key:null,cards:new Map(),els:new Map(),counts:[],cntEls:[]};let CNT=[],CARDS=new Map();
function cnt(t){CNT.push(t);return `<span data-c="${CNT.length-1}">${esc(t)}</span>`}
function renderNow(){
  const s=st.settings;
  if(s.lineSel.length>1)s.lineSel=[];
  // keyword chips
  $("#kwChips").innerHTML=s.saved.map((k,i)=>`<span class="chip ${s.q===k?"on":""}" data-kw="${i}">🔖 ${esc(k)}<span class="x" data-kwdel="${i}">×</span></span>`).join("");
  // line chips
  const all=[...st.items.values()];
  const allAct=all.filter(i=>!isOff(i));
  $("#lineChips").innerHTML=`<span class="chip ${s.lineSel.length?"":"on"}" data-line="">전체 <b>${allAct.filter(i=>i.owned).length}/${allAct.length}</b></span>`+s.lines.map(l=>{
    const its=all.filter(i=>i.line===l.name&&!i.off),o=its.filter(i=>i.owned).length;
    return `<span class="chip ${s.lineSel.includes(l.name)?"on":""} ${l.off?"dis":""}" data-line="${esc(l.name)}">${esc(l.name)} <b>${o}/${its.length}</b></span>`}).join("");
  // stats
  const act=all.filter(i=>!isOff(i)),own=act.filter(i=>i.owned).length;
  const plan=act.filter(i=>!i.owned&&i.plan).length,nop=act.filter(i=>!i.owned&&i.noplan).length,none=act.length-own;
  $("#statTxt").textContent=st.loaded?`있음 ${own} · 없음 ${none} (구매 예정 ${plan} / 예정 없음 ${nop} / 미정 ${none-plan-nop})  · 비활성 ${all.length-act.length}`:"불러오는 중…";
  $("#progBar").style.width=act.length?(own/act.length*100)+"%":"0";
  $("#status").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===s.status));
  $("#showOff").checked=s.showOff;$("#sort").value=s.sort;
  if(document.activeElement!==$("#q"))$("#q").value=s.q;
  // grid
  const list=visible();
  if(!st.loaded){MAIN.key=null;$("#main").innerHTML=`<div class="empty">불러오는 중…</div>`;return}
  if(!list.length){MAIN.key=null;$("#main").innerHTML=`<div class="empty">${all.length?"조건에 맞는 피규어가 없습니다.":"아직 등록된 피규어가 없습니다.<br>‘+ 추가’ 또는 ‘일괄 추가’로 시작하세요."}</div>`;return}
  const byLine=new Map();
  list.forEach(it=>{const l=it.line||"기타";if(!byLine.has(l))byLine.set(l,[]);byLine.get(l).push(it)});
  const lorder=s.lines.map(l=>l.name);
  const lks=[...byLine.keys()].sort((a,b)=>{const ia=lorder.indexOf(a),ib=lorder.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b,"ko")});
  CNT=[];CARDS=new Map();
  const html=lks.map(ln=>{const li=byLine.get(ln),la=li.filter(i=>!isOff(i)),lo=la.filter(i=>i.owned).length;
    return `<section class="lsec"><div class="lhead"><h2>${esc(ln)}</h2>${cnt(`있음 ${lo} / ${la.length}`)}</div>${yearsHtml(li)}</section>`}).join("");
  const key=s.sort+"|"+[...CARDS.keys()].join(",");
  const main=$("#main");
  if(key===MAIN.key&&main.querySelector(".lsec")){
    CARDS.forEach((c,id)=>{if(MAIN.cards.get(id)!==c){const el=MAIN.els.get(id);if(el){const t=document.createElement("template");t.innerHTML=c.trim();const n=t.content.firstElementChild;el.replaceWith(n);MAIN.els.set(id,n)}}});
    CNT.forEach((t,i)=>{if(MAIN.counts[i]!==t&&MAIN.cntEls[i])MAIN.cntEls[i].textContent=t});
  }else{
    main.innerHTML=html;MAIN.els=new Map();main.querySelectorAll(".card[data-id]").forEach(e=>MAIN.els.set(e.dataset.id,e));
    MAIN.cntEls=[...main.querySelectorAll("[data-c]")];
  }
  MAIN.key=key;MAIN.cards=CARDS;MAIN.counts=CNT;
}
function yearsHtml(list){
  const s=st.settings;
  const groups=new Map();
  list.forEach(it=>{const y=it.year||0;if(!groups.has(y))groups.set(y,[]);groups.get(y).push(it)});
  const ys=[...groups.keys()].sort((a,b)=>{if(!a)return 1;if(!b)return -1;return s.sort==="asc"?a-b:b-a});
  return ys.map(y=>{
    const g=groups.get(y).sort((a,b)=>(s.sort==="asc"?1:-1)*(a.date||"").localeCompare(b.date||"")||(a.line||"").localeCompare(b.line||"","ko")||(a.name||"").localeCompare(b.name||"","ko"));
    const gAct=g.filter(i=>!isOff(i)),gOwn=gAct.filter(i=>i.owned).length;
    const yc=cnt(`있음 ${gOwn} / ${gAct.length}`);
    const others=g.filter(i=>i.line!=="제일복권"&&i.line!=="조형천하"&&i.line!=="월드 콜렉터블(30주년)"),kuji=g.filter(i=>i.line==="제일복권"),zk=g.filter(i=>i.line==="조형천하"||i.line==="월드 콜렉터블(30주년)");
    const zser=new Map();zk.forEach(i=>{const k=(i.line==="조형천하"?"Z":"W")+"|"+(i.series||"");if(!zser.has(k))zser.set(k,[]);zser.get(k).push(i)});
    const zHtml=[...zser.keys()].sort((a,b)=>a[0]!==b[0]?(a[0]==="Z"?-1:1):(s.sort==="asc"?1:-1)*((parseInt(a.replace(/\D/g,""))||0)-(parseInt(b.replace(/\D/g,""))||0))).map(k=>{
      const its=zser.get(k).sort((a,b)=>sono(a.name)-sono(b.name)||a.name.localeCompare(b.name,"ja"));
      const act=its.filter(i=>!isOff(i)),o=act.filter(i=>i.owned).length,ds=its.map(i=>i.date).filter(Boolean).sort();
      const lab=k[0]==="Z"?"🏆 "+k.slice(2):"🌟 월드 콜렉터블 30주년 "+k.slice(2).replace("30th ","");return `<div class="ser"><b>${esc(lab)}</b>${cnt((ds.length?(ds[0]===ds[ds.length-1]?ds[0]:ds[0]+" ~ "+ds[ds.length-1]):"")+` · 있음 ${o} / ${act.length}`)}</div><div class="grid">${its.map(card).join("")}</div>`}).join("");
    const ser=new Map();kuji.forEach(i=>{const k=(i.date||"")+"|"+(i.series||i.seriesKo||"기타");if(!ser.has(k))ser.set(k,[]);ser.get(k).push(i)});
    const keys=[...ser.keys()].sort((a,b)=>(s.sort==="asc"?1:-1)*a.localeCompare(b));
    const kujiHtml=zHtml+keys.map(k=>{const its=ser.get(k).sort((a,b)=>prizeRank(a.prize)-prizeRank(b.prize));const f=its[0];
      const act=its.filter(i=>!isOff(i)),o=act.filter(i=>i.owned).length;
      return `<div class="ser"><b>🎫 제일복권 · ${esc(f.seriesKo||f.series||"")}</b>${cnt((f.date||"")+` · 있음 ${o} / ${act.length}`)}${f.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener">공식 페이지</a>`:""}</div><div class="grid">${its.map(card).join("")}</div>`}).join("");
    const othHtml=others.length?`<div class="grid">${others.map(card).join("")}</div>`:"";
    return `<div class="year"><h2>${y?y+"년":"연도 미상"}</h2>${yc}</div>${othHtml}${kujiHtml}`;
  }).join("");
}
function sono(n){if(/SPECIAL/i.test(n))return 90+("一二三".indexOf((n.match(/SPECIAL\s*其[之ノ]([一二三])/)||[])[1])+1);const m=n.match(/其[之ノ]([一二三四五六七八九])/)||n.match(/#(\d+)/);if(!m)return 50;return isNaN(m[1])?"一二三四五六七八九".indexOf(m[1])+1:+m[1]}
function prizeRank(p){p=p||"";if(/^(S|SP|콜라보)/.test(p))return 0;if(p.startsWith("라스트원"))return 99;const c=p.charCodeAt(0);return c>=65&&c<=90?c-64:50}
function card(it){const c=card0(it);CARDS.set(it.id,c);return c}
function card0(it){
  const off=isOff(it),src=imgSrc(it);
  const official=/^https:\/\/(bsp-prize\.jp|1kuji\.com|sf\.1kuji\.com)\//.test(it.url||"");
  const href=official?it.url:"https://www.google.com/search?tbm=isch&q="+encodeURIComponent("ドラゴンボール "+(it.name||"").replace(/\(재판\)|\(슈퍼 히어로\)|\(은하 기리기리\)|\(DB\)/g,""));
  const sub=[it.line,it.prize].filter(Boolean).join(" · ");
  const d=it.date?it.date.replace("-",".")+" 출시":"출시일 미상";
  return `<div class="card ${it.owned?"own":it.plan?"plan":it.noplan?"noplan":""} ${off?"off":""}" data-id="${it.id}">
    <div class="img" data-img="${it.id}" tabindex="0" title="클릭해서 크게 보기">${src?`<img src="${esc(src)}" alt="${esc(it.char||it.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:`<div class="hint">사진 없음</div>`}
      ${it.owned?`<span class="badge">✓ 보유</span>`:it.plan?`<span class="badge">♥ 구매 예정</span>`:it.noplan?`<span class="badge">⊘ 예정 없음</span>`:off?`<span class="badge">비활성</span>`:""}
      ${it.cv?`<span class="cvtag" title="같은 조형의 컬러 변형">🎨 ${esc(it.cv)}</span>`:""}
      ${!it.img&&st.autoImg[it.id]&&it.imgCheck?'<span class="chk" title="출처 목록에서 대조 필요로 표시된 사진">확인</span>':""}
      ${it.owned?"":`<button class="heart ${it.plan?"on":""}" data-st="plan" data-sid="${it.id}" title="구매 예정">${it.plan?"♥":"♡"}</button>`}
    </div>
    <div class="body">
      <div class="cn" title="${esc(it.name)}">${it.char?esc(it.char):'<span class="mute">캐릭터 미확인</span>'}</div>
      <div class="subl">${esc(sub)}</div>
      <div class="dl"><b>${esc(d)}</b><a href="${esc(href)}" target="_blank" rel="noopener">${official?"공식 상품":"이미지 검색"}</a></div>
      ${it.note?`<div class="memo">${esc(it.note)}</div>`:""}
      <div class="st3">
        <button class="s-own ${it.owned?"on":""}" data-st="own" data-sid="${it.id}">${it.owned?"✓ ":""}있음</button>
        <button class="s-none ${!it.owned?"on":""}" data-st="none" data-sid="${it.id}">없음</button>
      </div>
      <div class="opt ${it.owned?"hide":""}">
        <button class="s-plan ${it.plan?"on":""}" data-st="plan" data-sid="${it.id}">구매 예정</button>
        <button class="s-noplan ${it.noplan?"on":""}" data-st="noplan" data-sid="${it.id}">예정 없음</button>
      </div>
      <div class="acts"><button data-off="${it.id}">${it.off?"활성화":"비활성"}</button></div>
    </div></div>`;
}

/* ---------- events ---------- */
let qTimer;
$("#q").addEventListener("input",e=>{st.settings.q=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(()=>{render();saveSettings(800)},250)});
$("#saveKw").onclick=()=>{const q=st.settings.q.trim();if(!q)return toast("검색어를 먼저 입력하세요");if(!st.settings.saved.includes(q))st.settings.saved.push(q);render();saveSettings();toast("키워드 저장됨")};
$("#status").onclick=e=>{const v=e.target.dataset.v;if(!v)return;st.settings.status=v;render();saveSettings()};
$("#showOff").onchange=e=>{st.settings.showOff=e.target.checked;render();saveSettings()};
$("#sort").onchange=e=>{st.settings.sort=e.target.value;render();saveSettings()};
$("#kwChips").onclick=e=>{
  const d=e.target.dataset;
  if(d.kwdel!=null){st.settings.saved.splice(+d.kwdel,1);render();saveSettings();return}
  const c=e.target.closest("[data-kw]");if(!c)return;const k=st.settings.saved[+c.dataset.kw];

};

  st.settings.lineSel=n?[n]:[];render();saveSettings();window.scrollTo({top:0})};

let pasteTarget=null;
$("#main").addEventListener("click",e=>{
  const t=e.target.closest("button,[data-img]");if(!t)return;const d=t.dataset;
  if(d.sid){const it=st.items.get(d.sid);const v=d.st;let nx;
    if(v==="own")nx={...it,owned:true};
    else if(v==="none")nx={...it,owned:false};
    else if(v==="plan")nx={...it,owned:false,plan:!it.plan,noplan:false};
    else nx={...it,owned:false,noplan:!it.noplan,plan:false};
    if(nx.owned!==!!it.owned||!!nx.plan!==!!it.plan||!!nx.noplan!==!!it.noplan)putItem(nx)}
  else if(d.off){const it=st.items.get(d.off);putItem({...it,off:!it.off})}
  else if(d.edit)openEdit(d.edit);
  else if(d.img){const im=t.querySelector("img");if(im)openLB(im.src,im.alt)}
});
let _ptEl=null;function setTarget(el){
  if(_ptEl&&_ptEl!==el)_ptEl.classList.remove("pt");_ptEl=el;
  if(el){el.classList.add("pt");pasteTarget=el.dataset.img}
}
$("#main").addEventListener("focusin",e=>{const t=e.target.closest("[data-img]");if(t)setTarget(t)});
$("#main").addEventListener("mouseover",e=>{if(PUBLIC)return;const t=e.target.closest("[data-img]");if(t&&t.dataset.img!==pasteTarget)setTarget(t)});
function clipImage(cd){
  if(!cd)return null;
  for(const it of cd.items||[]){if(it.kind==="file"&&it.type.startsWith("image/")){const f=it.getAsFile();if(f)return f}}
  return [...(cd.files||[])].find(f=>f.type.startsWith("image/"))||null;
}
document.addEventListener("paste",e=>{if(PUBLIC)return;
  if($(".modal.show"))return;
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  const f=clipImage(e.clipboardData);
  if(!f){if(pasteTarget)toast("클립보드에 이미지가 없어요. 사진에서 우클릭 → ‘이미지 복사’ 후 다시 붙여넣으세요");return}
  e.preventDefault();
  if(!pasteTarget)return toast("붙일 카드의 사진 칸에 마우스를 올린 뒤 Ctrl+V 하세요");
  setImageFor(pasteTarget,f);
});
$("#main").addEventListener("dragover",e=>{if(e.target.closest("[data-img]"))e.preventDefault()});
$("#main").addEventListener("drop",e=>{const t=e.target.closest("[data-img]");if(!t)return;e.preventDefault();const f=e.dataTransfer.files[0];if(f)setImageFor(t.dataset.img,f)});
function pickFile(cb){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}

/* modals */
const open=id=>$(id).classList.add("show"),close=el=>el.closest(".modal").classList.remove("show");
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>close(b));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("mousedown",e=>{if(e.target===m)m.classList.remove("show")}));
function confirmBox(txt){return new Promise(r=>{$("#confTxt").textContent=txt;open("#mConf");
  $("#confOk").onclick=()=>{close($("#confOk"));r(true)};$("#mConf").querySelector("[data-close]").onclick=()=>{close($("#confOk"));r(false)}})}

function fillLineSelect(sel){$("#fLine").innerHTML=st.settings.lines.map(l=>`<option ${l.name===sel?"selected":""}>${esc(l.name)}</option>`).join("")}
function openEdit(id){
  st.editId=id||null;const it=id?st.items.get(id):{line:st.settings.lineSel[0]||st.settings.lines[0]?.name,year:new Date().getFullYear()};
  $("#eTitle").textContent=id?"피규어 편집":"피규어 추가";fillLineSelect(it.line);
  $("#fName").value=it.name||"";$("#fChar").value=it.char||"";$("#fSeries").value=it.series||"";$("#fYear").value=it.year||"";
  $("#fKw").value=(it.kw||[]).join(", ");$("#fNote").value=it.note||"";$("#fStat").value=it.owned?"own":it.plan?"plan":it.noplan?"noplan":"none";$("#fOff").checked=!!it.off;$("#fImg").value="";
  $("#eDel").style.display=id?"":"none";open("#mEdit");$("#fName").focus();
}
$("#addBtn").onclick=()=>openEdit();
$("#eSave").onclick=async()=>{
  const name=$("#fName").value.trim();if(!name)return toast("이름을 입력하세요");
  const base=st.editId?st.items.get(st.editId):{id:uid(),ts:Date.now()};
  const newChar=$("#fChar").value.trim(),catChar=(st.cat.get(base.id)||{}).char;
  let it={...base,name,char:newChar,charCustom:!!(base.charCustom||(catChar&&newChar!==catChar)),custom:true,line:$("#fLine").value,series:$("#fSeries").value.trim(),
    year:parseInt($("#fYear").value)||null,kw:$("#fKw").value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    note:$("#fNote").value.trim(),owned:$("#fStat").value==="own",plan:$("#fStat").value==="plan",noplan:$("#fStat").value==="noplan",off:$("#fOff").checked};
  const f=$("#fImg").files[0];close($("#eSave"));
  if(f){try{toast("이미지 업로드 중…");Object.assign(it,await storeImage(f))}catch(e){toast("이미지 실패: "+(e.message||e))}}
  await putItem(it);toast("저장됨");
};
$("#eDel").onclick=async()=>{const id=st.editId;close($("#eDel"));if(await confirmBox(`“${st.items.get(id)?.name}”을(를) 삭제할까요? 되돌릴 수 없습니다.`))delItem(id)};

$("#bulkBtn").onclick=()=>{$("#bulkTxt").value="";open("#mBulk")};
$("#bulkGo").onclick=async()=>{
  const rows=$("#bulkTxt").value.split("\n").map(l=>l.trim()).filter(Boolean);let n=0;
  close($("#bulkGo"));
  for(const r of rows){
    const p=r.split(/\s*[|\t]\s*/);const [y,line,name,char,series,kw]=p;
    if(!name)continue;
    if(line&&!st.settings.lines.some(l=>l.name===line)){st.settings.lines.push({name:line,off:false});saveSettings()}
    await putItem({id:uid(),ts:Date.now(),year:parseInt(y)||null,line:line||st.settings.lines[0].name,name,char:char||"",series:series||"",
      kw:(kw||"").split(/[,，]/).map(s=>s.trim()).filter(Boolean),note:"",owned:false,off:false});n++;
  }
  toast(n+"개 추가됨");
};

function renderLinesEd(){
  $("#linesEd").innerHTML=st.settings.lines.map((l,i)=>{const c=[...st.items.values()].filter(x=>x.line===l.name).length;
    return `<div class="ln"><b style="${l.off?"text-decoration:line-through;opacity:.5":""}">${esc(l.name)}</b><span class="sub">${c}개</span>
    <button data-lt="${i}">${l.off?"활성화":"비활성"}</button><button data-lu="${i}">↑</button><button data-ld="${i}" ${c?"disabled title='제품이 있는 라인은 삭제 불가'":""}>삭제</button></div>`}).join("");
}
$("#linesBtn").onclick=()=>{renderLinesEd();open("#mLines")};
$("#linesEd").onclick=e=>{const d=e.target.dataset,L=st.settings.lines;
  if(d.lt!=null)L[+d.lt].off=!L[+d.lt].off;
  else if(d.lu!=null&&+d.lu>0){const i=+d.lu;[L[i-1],L[i]]=[L[i],L[i-1]]}
  else if(d.ld!=null){const n=L[+d.ld].name;L.splice(+d.ld,1);st.settings.lineSel=st.settings.lineSel.filter(x=>x!==n)}
  else return;renderLinesEd();render();saveSettings()};
$("#addLine").onclick=()=>{const n=$("#newLine").value.trim();if(!n)return;if(!st.settings.lines.some(l=>l.name===n))st.settings.lines.push({name:n,off:false});$("#newLine").value="";renderLinesEd();render();saveSettings()};

$("#ioBtn").onclick=()=>{$("#ioTxt").value=JSON.stringify({lines:st.settings.lines,items:[...st.items.values()]},null,1);open("#mIO")};
$("#ioCopy").onclick=async()=>{try{await navigator.clipboard.writeText($("#ioTxt").value);toast("복사됨")}catch(e){$("#ioTxt").select();toast("복사가 막혔습니다. 직접 선택해 복사하세요")}};
$("#ioImport").onclick=async()=>{
  let o;try{o=JSON.parse($("#ioTxt").value)}catch(e){return toast("JSON 형식이 아닙니다")}
  const items=Array.isArray(o)?o:(o.items||[]);
  (o.lines||[]).forEach(l=>{if(l&&l.name&&!st.settings.lines.some(x=>x.name===l.name))st.settings.lines.push({name:String(l.name),off:!!l.off})});
  saveSettings();close($("#ioImport"));let n=0;
  for(const r of items){if(!r||!r.name)continue;
    if(r.id&&st.items.has(r.id)){const ex=st.items.get(r.id);const im=ex.img;
      if(!!ex.owned!==!!r.owned||!!ex.plan!==!!r.plan||!!ex.noplan!==!!r.noplan||!!ex.off!==!!r.off||(r.note||"")!==(ex.note||"")||im!==ex.img){await putItem({...ex,owned:!!r.owned,plan:!!r.plan,noplan:!!r.noplan,off:!!r.off,note:r.note||"",img:im||""});n++}continue}
    if(PUBLIC)continue;const id=uid();
    await putItem({id,ts:r.ts||Date.now(),name:String(r.name),char:r.char||"",line:r.line||"",series:r.series||"",year:parseInt(r.year)||null,
      kw:Array.isArray(r.kw)?r.kw.map(String):[],note:r.note||"",owned:!!r.owned,off:!!r.off,img:typeof r.img==="string"?r.img:""});n++}
  toast(n+"개 반영됨");
};


/* ---------- bulk folder import ---------- */
let IMGMAP=null;
$("#folderBtn").onclick=()=>{
  if(LOCAL||!ASSETS)return toast("클라우드 저장소에 연결된 상태에서만 일괄 등록할 수 있어요");
  $("#folderIn").value="";$("#folderIn").click();
};
$("#folderIn").onchange=async e=>{
  const files=[...e.target.files].filter(f=>/^\d{4}_/.test(f.name)&&/\.(jpe?g|png|webp)$/i.test(f.name));
  if(!files.length)return toast("번호(0001_…)로 시작하는 사진을 찾지 못했어요");
  try{IMGMAP=IMGMAP||await (await fetch("imgmap.json")).json()}catch(err){return toast("매핑 파일을 불러오지 못했어요")}
  const todo=files.filter(f=>{const id=IMGMAP[f.name.slice(0,4)];return id&&!st.autoImg[id]});
  if(!todo.length)return toast("이미 모두 등록돼 있어요");
  const map={...st.autoImg};let done=0,fail=0,since=0;
  const flush=async()=>{try{await DB.doc("meta/images").set({map})}catch(err){handleErr(err)}};
  note(`사진 등록 중… 0 / ${todo.length} (창을 닫지 마세요)`);
  for(const f of todo){
    const id=IMGMAP[f.name.slice(0,4)];
    for(let t=0;t<3;t++){
      try{const blob=await shrink(f,520);const r=await ASSETS.upload(blob);map[id]=r.id;done++;since++;break}
      catch(err){if(t===2){fail++}else await new Promise(r=>setTimeout(r,1500*(t+1)))}
    }
    if(since>=25){since=0;await flush();st.autoImg={...map};render()}
    note(`사진 등록 중… ${done+fail} / ${todo.length}${fail?` (실패 ${fail})`:""} (창을 닫지 마세요)`);
  }
  await flush();st.autoImg={...map};render();
  note("");toast(`사진 ${done}장 등록 완료${fail?`, 실패 ${fail}장 (다시 누르면 실패분만 재시도)`:""}`);
};


$("#menuBtn").onclick=e=>{e.stopPropagation();$("#drop").classList.toggle("show")};
document.addEventListener("click",e=>{if(!e.target.closest(".menu"))$("#drop").classList.remove("show")});
$("#drop").addEventListener("click",()=>$("#drop").classList.remove("show"));
/* ---------- boot ---------- */
render();
const catReady=fetch("catalog.json").then(r=>r.ok?r.json():[]).then(a=>{a.forEach(c=>st.cat.set(c.id,c));rebuild();render()}).catch(()=>{});
(async()=>{
  await catReady;
  let db=null;
  try{db=window.claude&&await window.claude.use("db")}catch(e){}
  if(!db){LOCAL=true;lsLoad();st.loaded=true;note("체크 기록은 이 브라우저에만 저장되고 다른 사람에게는 보이지 않습니다.");render();return}
  DB=db;
  try{ASSETS=await window.claude.use("assets")}catch(e){}
  try{const u=await window.claude.use("user");if(u&&u.can){const w=await u.can("data.write");if(w===false){st.canWrite=false;note("읽기 전용 보기입니다.")}}}catch(e){}
  const timer=setTimeout(()=>{if(!st.loaded){st.loaded=true;note("저장소 응답이 늦습니다. 잠시 후 자동으로 반영됩니다.");render()}},10000);
  let gotItems=false,gotSet=false;
  db.doc("meta/settings").onSnapshot(s=>{
    if(s.exists){const d=s.data();const keepQ=document.activeElement===$("#q")?st.settings.q:null;
      const before=JSON.stringify(st.settings);st.settings={...st.settings,...JSON.parse(JSON.stringify(d))};if(keepQ!=null)st.settings.q=keepQ;
      if(gotSet&&st.loaded&&JSON.stringify(st.settings)===before)return}
    gotSet=true;if(gotItems&&!s.metadata.fromCache){clearTimeout(timer);st.loaded=true;note("")}render();
  },e=>{handleErr(e)});
  db.doc("meta/images").onSnapshot(s=>{st.autoImg=s.exists?{...(s.data().map||{})}:{};render()},e=>{});
  db.collection("figures").onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));st.over=m;rebuild();
    gotItems=true;if(!snap.metadata.fromCache){clearTimeout(timer);st.loaded=true;if(!$("#note").textContent.startsWith("읽기"))note("")}render();
  },e=>{clearTimeout(timer);st.loaded=true;handleErr(e);render()});
})();
</script>
